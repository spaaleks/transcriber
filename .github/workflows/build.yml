name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build script is executable
        run: chmod +x bin/buildAnyPlatform.sh

      - name: Build linux/amd64 binary
        run: bin/buildAnyPlatform.sh linux/amd64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-binaries
          path: |
            dist/transcriber.linux-amd64
          if-no-files-found: error

      - name: Docker build smoke test (amd64)
        run: docker build -f .build/Dockerfile -t transcriber:test .
